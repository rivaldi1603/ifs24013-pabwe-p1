<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Form Pendaftaran Akun Pengguna">
    <meta name="author" content="Student">
    <title>Form Pendaftaran Akun</title>
</head>
<body>
    <!-- Navigasi Utama -->
    <p>
        <a href="index.html">IMDb Movies</a> | 
        <a href="blog.html">Dev Blogs</a> | 
        <a href="form.html">Form Pendaftaran</a> | 
        <a href="cv.html">Curriculum Vitae</a>
    </p>
    <hr>
    
    <!-- Konten Form Pendaftaran -->
    <form action="#" method="POST">
        <fieldset>
            <legend>Daftar Akun</legend>
            
            <label for="nama_lengkap">Nama Lengkap: </label>
            <input type="text" name="nama_lengkap" id="nama_lengkap" required>
            <hr>
            
            Jenis Kelamin: 
            <input type="radio" name="jenis_kelamin" id="laki_laki" value="Laki-Laki" required>
            <label for="laki_laki">Laki-Laki</label>
            <input type="radio" name="jenis_kelamin" id="perempuan" value="Perempuan" required>
            <label for="perempuan">Perempuan</label>
            <hr>
            
            <label for="tempat_lahir">Tempat Lahir: </label>
            <input type="text" name="tempat_lahir" id="tempat_lahir" required>
            <hr>
            
            <label for="tanggal_lahir">Tanggal Lahir: </label>
            <input type="date" name="tanggal_lahir" id="tanggal_lahir" required>
            <hr>
            
            <label for="agama">Agama: </label>
            <select name="agama" id="agama" required>
                <option value="">--- Pilih Agama ---</option>
                <option value="Islam">Islam</option>
                <option value="Katolik">Katolik</option>
                <option value="Protestan">Protestan</option>
                <option value="Hindu">Hindu</option>
                <option value="Buddha">Buddha</option>
                <option value="Konghucu">Konghucu</option>
            </select>
            <hr>
            
            Hobi: 
            <input type="checkbox" name="hobi" id="olahraga" value="Olahraga">
            <label for="olahraga">Olahraga</label>
            <input type="checkbox" name="hobi" id="membaca" value="Membaca">
            <label for="membaca">Membaca</label>
            <input type="checkbox" name="hobi" id="ngoding" value="Ngoding">
            <label for="ngoding">Ngoding</label>
            <hr>
            
            <label for="password">Password: </label>
            <input type="password" name="password" id="password" required>
            <hr>
            
            <input type="checkbox" name="persetujuan" id="persetujuan" value="Setuju" required>
            <label for="persetujuan">Dengan mendaftar saya setuju dengan Ketentuan dan Kebijakan Privasi Aplikasi.</label>
            <hr>
            
            <input type="reset" value="Reset">
            <input type="submit" value="Submit">
        </fieldset>
    </form>
</body>
</html>
