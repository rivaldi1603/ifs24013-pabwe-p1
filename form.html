<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Form Pendaftaran Akun</title>
</head>
<body>
    <!-- Navigasi Antar Halaman -->
    <nav>
        <a href="index.html">IMDb</a> |
        <a href="blog.html">Dev Blogs</a> |
        <a href="form.html">Pendaftaran Akun</a> |
        <a href="cv.html">Curriculum Vitae</a>
    </nav>
    <hr>

    <!-- Form Pendaftaran -->
    <form action="" method="post">
        <fieldset>
            <legend>Daftar Akun</legend>
            <!-- Input Biodata -->
            <p>Nama Lengkap: <input type="text" name="nama"></p>
            <hr>
            <p>Jenis Kelamin: 
                <input type="radio" id="lk" name="jenis_kelamin" value="Laki-Laki"> <label for="lk">Laki-Laki</label>
                <input type="radio" id="pr" name="jenis_kelamin" value="Perempuan"> <label for="pr">Perempuan</label>
            </p>
            <hr>
            <p>Tempat Lahir: <input type="text" name="tempat_lahir"></p>
            <hr>
            <p>Tanggal Lahir: <input type="date" name="tanggal_lahir"></p>
            <hr>
            <p>Agama: 
                <select name="agama">
                    <option value="">--- Pilih Agama ---</option>
                    <option value="Islam">Islam</option>
                    <option value="Katolik">Katolik</option>
                    <option value="Protestan">Protestan</option>
                    <option value="Hindu">Hindu</option>
                    <option value="Buddha">Buddha</option>
                    <option value="Konghucu">Konghucu</option>
                </select>
            </p>
            <hr>
            <p>Hobi: 
                <input type="checkbox" id="olahraga" name="hobi" value="Olahraga"> <label for="olahraga">Olahraga</label>
                <input type="checkbox" id="membaca" name="hobi" value="Membaca"> <label for="membaca">Membaca</label>
                <input type="checkbox" id="ngoding" name="hobi" value="Ngoding"> <label for="ngoding">Ngoding</label>
            </p>
            <hr>
            <!-- Input Keamanan -->
            <p>Password: <input type="password" name="password"></p>
            <hr>
            <p>
                <input type="checkbox" id="setuju" name="setuju" value="Ya">
                <label for="setuju">Dengan mendaftar saya setuju dengan Ketentuan dan Kebijakan Privasi Aplikasi.</label>
            </p>
            <hr>
            <!-- Tombol Aksi Form -->
            <p>
                <input type="reset" value="Reset">
                <input type="submit" value="Submit">
            </p>
        </fieldset>
    </form>
</body>
</html>
